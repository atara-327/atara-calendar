name: CI

on:
  pull_request:
  push:
    branches: [main]
  # 最初のデプロイなど、main を手で動かしたいとき用（docs/setup.md の 6）。
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx wrangler types --check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  # main に取り込まれたら、確認（check）が通った後に本番へデプロイする（設計書 Q7）。
  # DEPLOY_ENABLED は、本番の下準備（docs/setup.md）が終わってからユーザーが true にする。
  # それまでは動かないので、下準備の前に main へ取り込んでもデプロイは失敗しない。
  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    # デプロイが重なると、古いコードが後から上書きすることがあるので、1つずつ順番に動かす。
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      # 新しいコードが新しいテーブルの形を前提にできるよう、マイグレーションを先に当てる。
      - run: npx wrangler d1 migrations apply atara-calendar --remote
      - run: npx wrangler deploy
